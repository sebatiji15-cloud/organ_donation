<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request an Organ - Organ Donation Portal</title>

    <!-- Font Icon -->
    <link rel="stylesheet" href="{% static 'odreg/fonts/material-icon/css/material-design-iconic-font.min.css' %}">
    <link rel="stylesheet" href="{% static 'odreg/vendor/jquery-ui/jquery-ui.min.css' %}">

    <!-- Main css -->
    <link rel="stylesheet" href="{% static 'odreg/css/style.css' %}">
</head>
<body>

    <div class="main">

        <section class="signup">
            <div class="container">
                <div class="signup-content">
                    <form method="POST" action="/odreg/" class="signup-form">
                        {% csrf_token %}
                        <h2 class="form-title" style="text-align:center; margin-bottom: 25px; color: #333;">Request an Organ</h2>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="username">Patient / Requester Name</label>
                                <input type="text" class="form-input" name="username" id="username" value="{{ initial_username }}" required />
                            </div>
                            <div class="form-group">
                                <label for="email">Contact Email</label>
                                <input type="email" class="form-input" name="email" id="email" value="{{ initial_email }}" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="address">Address</label>
                                <input type="text" class="form-input" name="address" id="address" required />
                            </div>
                            <div class="form-group">
                                <label for="age">Patient Age</label>
                                <input type="number" class="form-input" name="age" id="age" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group form-icon">
                                <label for="bloodgroup">Blood Group Required</label>
                                <select class="form-input" name="bloodgroup" id="bloodgroup" required>
                                    <option value="">Select Blood Group</option>
                                    <option value="A +ve">A +ve</option>
                                    <option value="A -ve">A -ve</option>
                                    <option value="B +ve">B +ve</option>
                                    <option value="B -ve">B -ve</option>
                                    <option value="AB +ve">AB +ve</option>
                                    <option value="AB -ve">AB -ve</option>
                                    <option value="O +ve">O +ve</option>
                                    <option value="O -ve">O -ve</option>
                                </select>
                            </div>
                            <div class="form-group form-icon">
                                <label for="organtype">Organ Type Needed</label>
                                <input type="text" class="form-input" name="organtype" id="organtype" placeholder="e.g. Kidney, Heart, Liver" required />
                            </div>
                            <div class="form-radio">
                                <label for="">Gender</label>
                                <div class="form-flex">
                                    <input type="radio" name="gender" value="male" id="male" checked="checked" />
                                    <label for="male">Male</label>
    
                                    <input type="radio" name="gender" value="female" id="female" />
                                    <label for="female">Female</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="phonenumber">Contact Phone Number</label>
                            <input type="tel" class="form-input" name="phonenumber" id="phonenumber" required />
                        </div>
                        <div class="form-group">
                            <input type="submit" name="submit" id="submit" class="form-submit" value="Submit Organ Request" />
                        </div>
                        <div style="text-align: center; margin-top: 15px;">
                            <a href="/user/" style="color: #666; text-decoration: none; font-size: 14px;">&larr; Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>

    </div>

    <!-- JS -->
    <script src="{% static 'odreg/vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'odreg/vendor/jquery-ui/jquery-ui.min.js' %}"></script>
    <script src="{% static 'odreg/js/main.js' %}"></script>
</body>
</html>
