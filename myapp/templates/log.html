<!doctype html>
{% load static %}
<html lang="en">
  <head>
  	<title>Login - Organ Donation Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="{% static 'log/css/style.css' %}">
	</head>
	<body>
	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-4">
					<h2 class="heading-section">Organ Donation Portal</h2>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-md-7 col-lg-5">
					<div class="login-wrap p-4 p-md-5">
		      	<div class="icon d-flex align-items-center justify-content-center">
		      		<span class="fa fa-user-o"></span>
		      	</div>
		      	<h3 class="text-center mb-4">Sign In</h3>

				{% if error %}
				<div class="alert alert-danger text-center" role="alert" style="font-size: 14px; padding: 10px; margin-bottom: 20px;">
					{{ error }}
				</div>
				{% endif %}

				{% if registered %}
				<div class="alert alert-success text-center" role="alert" style="font-size: 14px; padding: 10px; margin-bottom: 20px;">
					Account registered successfully! Please log in.
				</div>
				{% endif %}

				<form action="/log/" class="login-form" method="post">
					{% csrf_token %}
		      		<div class="form-group">
		      			<input type="text" class="form-control rounded-left" name="username" placeholder="Username" required>
		      		</div>
	            <div class="form-group d-flex">
	              <input type="password" class="form-control rounded-left" name="password" placeholder="Password" required>
	            </div>
	            <div class="form-group">
	            	<button type="submit" class="form-control btn btn-primary rounded submit px-3">Login</button>
	            </div>
	            <div class="form-group d-md-flex justify-content-between text-center mt-3">
					<div>
						<a href="/reg/" style="color: #007bff; font-size: 13px;">New User? Register</a>
					</div>
					<div>
						<a href="/hosreg/" style="color: #28a745; font-size: 13px;">Hospital Register</a>
					</div>
	            </div>
	            <div class="text-center mt-3">
					<a href="/" style="color: #6c757d; font-size: 13px;"><i class="fa fa-arrow-left"></i> Back to Home</a>
	            </div>
	          </form>
	        </div>
				</div>
			</div>
		</div>
	</section>

	<script src="{% static 'log/js/jquery.min.js' %}"></script>
    <script src="{% static 'log/js/popper.js' %}"></script>
    <script src="{% static 'log/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'log/js/main.js' %}"></script>

	</body>
</html>
